# SKIP CI in commit message to skip hooks
skip_output:
  - meta
  - success
  - summary

pre-commit:
  parallel: false
  commands:
    format:
      priority: 1
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,json5,css,scss,less,md,mdx,yml,yaml,html,graphql,gql,toml}"
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      priority: 2
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}
    check-types:
      priority: 3
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
